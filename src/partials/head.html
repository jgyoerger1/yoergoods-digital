<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="author" content="{{site.owner}}">
<meta name="theme-color" content="#0b1420">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ogtitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogimage}}">
<meta property="og:image:type" content="{{ogimagetype}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogimagealt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogtitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogimage}}">
<meta name="twitter:image:alt" content="{{ogimagealt}}">
<link rel="icon" href="{{base}}/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{base}}/apple-touch-icon.png">
<link rel="manifest" href="{{base}}/site.webmanifest">
<link rel="sitemap" type="application/xml" href="{{base}}/sitemap.xml">
<link rel="preload" href="{{base}}/css/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin media="(min-width: 981px)">
<link rel="preload" href="{{base}}/css/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin media="(min-width: 981px)">
<link rel="stylesheet" href="{{base}}/css/site.css">
<script>(function(){try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var d=document.documentElement,off=function(){if(!window.YG_MOTION_READY)d.classList.remove('motion');};d.classList.add('motion');setTimeout(off,2500);document.addEventListener('DOMContentLoaded',off);}}catch(e){}})();</script>
<script>window.YG={{config}};</script>
<script type="application/ld+json">{{orgjsonld}}</script>
</head>
<body class="{{bodyclass}}">
