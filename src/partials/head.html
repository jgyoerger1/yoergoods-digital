<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="author" content="{{site.owner}}">
<meta name="theme-color" content="#0b1420">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ogtitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site.domain}}{{base}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Yoergoods Digital. Websites that work harder.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogtitle}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site.domain}}{{base}}/og-image.png">
<link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{base}}/apple-touch-icon.png">
<link rel="manifest" href="{{base}}/site.webmanifest">
<link rel="sitemap" type="application/xml" href="{{base}}/sitemap.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{base}}/css/site.css">
<script>(function(){try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('motion');}}catch(e){}})();</script>
<script>window.YG={{config}};</script>
<script type="application/ld+json">{{orgjsonld}}</script>
</head>
<body class="{{bodyclass}}">
